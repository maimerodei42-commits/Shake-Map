<!-- ★★★ データ同期スクリプト ★★★ -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { getFirestore, collection, onSnapshot, doc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

const myFirebaseConfig = {
apiKey: "AIzaSyB3EdYpV25yrAHFLguV5QgQcOclJBQcSM0",
authDomain: "shake-map-f7171.firebaseapp.com",
projectId: "shake-map-f7171",
storageBucket: "shake-map-f7171.firebasestorage.app",
messagingSenderId: "836003488202",
appId: "1:836003488202:web:983a091d3ecd185fadef33"
};

window.spots = window.spots || [];

try {
const app = initializeApp(myFirebaseConfig);
const db = getFirestore(app);
const spotsCollection = collection(db, 'spots');

onSnapshot(spotsCollection, (snapshot) => {
const cloudSpots = snapshot.docs.map(docSnap => ({ id: docSnap.id, ...docSnap.data() }));
const cloudIds = new Set(cloudSpots.map(s => s.id));

window.spots.forEach(localSpot => {
if (!cloudIds.has(localSpot.id)) {
setDoc(doc(spotsCollection, localSpot.id), localSpot).catch(e => console.error(e));
}
});

const spotMap = new Map();
window.spots.forEach(s => spotMap.set(s.id, s));
cloudSpots.forEach(s => spotMap.set(s.id, s));

window.spots = Array.from(spotMap.values());
window.saveLocalStorageSpots();

if (typeof window.renderMarkers === 'function') window.renderMarkers();
if (typeof window.updateProgress === 'function') window.updateProgress();
if (typeof window.updateAnalytics === 'function') window.updateAnalytics();

const statusEl = document.getElementById('statSyncStatus');
if (statusEl) {
statusEl.textContent = "完全同期済";
statusEl.className = "font-bold text-blue-600";
}
const indicatorEl = document.getElementById('syncIndicator');
if (indicatorEl) {
indicatorEl.className = "w-1.5 h-1.5 rounded-full bg-blue-500 animate-pulse";
}
}, (err) => {
console.error("Cloud sync error:", err);
const statusEl = document.getElementById('statSyncStatus');
if (statusEl) {
statusEl.textContent = "未接続 (ローカル)";
statusEl.className = "font-bold text-rose-600";
}
const indicatorEl = document.getElementById('syncIndicator');
if (indicatorEl) {
indicatorEl.className = "w-1.5 h-1.5 rounded-full bg-rose-500";
}
});

window.saveSpotToCloud = async function(spot) {
try {
await setDoc(doc(spotsCollection, spot.id), spot);
} catch (e) {
console.error("Save error:", e);
}
};

window.deleteSpotFromCloud = async function(id) {
try {
await deleteDoc(doc(spotsCollection, id));
} catch (e) {
console.error("Delete error:", e);
}
};

} catch (e) {

const statusEl = document.getElementById('statSyncStatus');

const indicatorEl = document.getElementById('syncIndicator');

}
}
</script>

function findNearestPrefecture(lat, lng) {
let closest = PREFECTURES[0].name;
let minDistance = Infinity;

PREFECTURES.forEach(p => {
const dist = Math.hypot(p.lat - lat, p.lng - lng);
if (dist < minDistance) {
minDistance = dist;
closest = p.name;
}
});
return closest;
}

document.getElementById('prefSelect').value = prefName;

areaSelect.innerHTML = '<option value="">全体表示</option>';
if (pref.areas && pref.areas.length > 0) {
pref.areas.forEach((area, index) => {
const opt = document.createElement('option');
opt.value = index;
opt.textContent = area.name;
areaSelect.appendChild(opt);
});
areaSelect.disabled = false;
} else {
areaSelect.disabled = true;
}
}

function zoomToArea(areaIndex) {

const pref = PREFECTURES.find(p => p.name === prefName);

map.flyTo([pref.lat, pref.lng], pref.zoom, { duration: 1.2, easeLinearity: 0.25 });

}

const area = pref.areas[parseInt(areaIndex)];
if (area) {
map.flyTo([area.lat, area.lng], area.zoom, { duration: 1.3, easeLinearity: 0.2 });
}
}

async function searchLocation() {
const query = document.getElementById('searchInput').value.trim();
const resultsDiv = document.getElementById('searchResults');

if (!query) return;

resultsDiv.innerHTML = `<div class="p-3 text-xs text-slate-500 text-center flex items-center justify-center gap-2">
<span class="animate-spin text-rose-500">⌛</span> 検索中...
</div>`;
resultsDiv.classList.remove('hidden');

try {
const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&countrycodes=jp&limit=5&accept-language=ja`);
const data = await response.json();

if (data.length === 0) {
resultsDiv.innerHTML = `<div class="p-3 text-xs text-slate-500 text-center">見つかりませんでした</div>`;
return;
}

resultsDiv.innerHTML = '';
data.forEach(item => {
const lat = parseFloat(item.lat);
const lon = parseFloat(item.lon);
const name = item.display_name.split(',')[0];
const prefName = findNearestPrefecture(lat, lon);

const div = document.createElement('div');
div.className = 'p-3 hover:bg-slate-50 cursor-pointer transition text-xs flex flex-col gap-0.5';
div.innerHTML = `
<div class="font-bold text-slate-800">${name}</div>
<div class="text-[10px] text-slate-500 truncate">${item.display_name}</div>
`;
div.onclick = function() {
resultsDiv.classList.add('hidden');
removeSearchMarker();

map.flyTo([lat, lon], 16, { duration: 1.5, easeLinearity: 0.2 });

const searchIcon = L.divIcon({
html: `<div class="custom-pin search-pin" style="background-color: #f43f5e; width: 28px; height: 28px; border-width: 2px;">
<i data-lucide="map-pin" style="width:16px;height:16px;"></i>
</div>`,
className: '',
iconSize: [28, 28],
iconAnchor: [14, 14]
});

searchMarker = L.marker([lat, lon], { icon: searchIcon }).addTo(map);
lucide.createIcons();

const popupContent = `
<div class="p-1 text-center font-sans">
<div class="font-bold text-sm text-slate-800 mb-1">${name}</div>
<div class="text-xs text-slate-500 mb-2">${prefName}</div>
<button onclick="openAddModal(${lat}, ${lon}, '${prefName}', '${name.replace(/'/g, "\\'")}')" class="bg-rose-500 hover:bg-rose-600 text-white font-bold text-xs px-3 py-1.5 rounded-lg shadow transition">
ここに思い出を追加
</button>
</div>
`;
searchMarker.bindPopup(popupContent, { closeButton: false }).openPopup();
};
resultsDiv.appendChild(div);
});
} catch (err) {
resultsDiv.innerHTML = `<div class="p-3 text-xs text-rose-500 text-center">検索エラーが発生しました</div>`;
}
}

window.renderMarkers = function() {
if (!map) return;
markers.forEach(m => map.removeLayer(m));

const locationMap = new Map();
(window.spots || []).forEach(spot => {
if (currentFilter !== 'all' && spot.genre !== currentFilter) return;
const key = `${spot.lat.toFixed(4)},${spot.lng.toFixed(4)}`;
if (!locationMap.has(key)) {
locationMap.set(key, []);
}
locationMap.get(key).push(spot);
});

locationMap.forEach((spotsAtLoc, key) => {
spotsAtLoc.sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0));

const primarySpot = spotsAtLoc[0];
const genreInfo = GENRE_CONFIG[primarySpot.genre] || GENRE_CONFIG.gourmet;
const isSpecial = primarySpot.genre === 'want' || primarySpot.genre === 'today';
const pinSize = isSpecial ? 20 : 24;
const iconSize = isSpecial ? 11 : 13;
const anchorSize = isSpecial ? 10 : 12;

${countBadge}
</div>`;

const customIcon = L.divIcon({
html: iconHtml,
className: '',
iconSize: [pinSize, pinSize],
iconAnchor: [anchorSize, anchorSize]

const marker = L.marker([primarySpot.lat, primarySpot.lng], { icon: customIcon }).addTo(map);

if (spotsAtLoc.length === 1) {
openDetailModal(spotsAtLoc[0].id);

window.updateProgress = function() {
const visitedSpots = (window.spots || []).filter(s => s.genre !== 'want' && s.genre !== 'today');
const visitedPrefs = new Set(visitedSpots.map(s => s.pref));
const count = visitedPrefs.size;
const percent = ((count / 47) * 100).toFixed(1);

document.getElementById('progressStats').textContent = `${count}/47 (${percent}%)`;
document.getElementById('progressBar').style.width = `${percent}%`;
};

window.updateAnalytics = function() {
const spots = window.spots || [];
document.getElementById('statTotalPins').textContent = `${spots.length}個`;

const authors = new Set();
spots.forEach(s => {
if (s.author && s.author.trim() !== "") {
authors.add(s.author.trim());
}
});
document.getElementById('statAuthors').textContent = `${Math.max(authors.size, spots.length > 0 ? 1 : 0)}人`;

const todayStr = new Date().toISOString().split('T')[0];
const yesterdayObj = new Date();
yesterdayObj.setDate(yesterdayObj.getDate() - 1);
const yesterdayStr = yesterdayObj.toISOString().split('T')[0];

let todayCount = 0;
let yesterdayCount = 0;

spots.forEach(s => {
const spotDate = s.date || (s.id ? new Date(parseInt(s.id)).toISOString().split('T')[0] : '');
if (spotDate === todayStr) todayCount++;
if (spotDate === yesterdayStr) yesterdayCount++;
});

const diff = todayCount - yesterdayCount;
const diffEl = document.getElementById('statDayDiff');
if (diff > 0) {
diffEl.textContent = `+${diff}`;
diffEl.className = "font-bold text-emerald-600";
} else if (diff < 0) {
diffEl.textContent = `${diff}`;
diffEl.className = "font-bold text-rose-600";
} else {
diffEl.textContent = `±0`;
diffEl.className = "font-bold text-slate-700";
}
};

function openChartModal() {

function switchModalTab(tab) {

const btn = document.getElementById(`modalTab${t.charAt(0).toUpperCase() + t.slice(1)}`);

if(tab === 'chart'){
// 描画のタイミングをほんの少し遅らせることで確実にサイズを取得させる
setTimeout(() => {
renderAnalyticsChart(currentChartMode);
}, 10);
} else if (tab === 'pref') {

} else if (tab === 'list') {
renderSpotList();
}
} else {

}

function switchChartMode(mode) {
currentChartMode = mode;
['monthly', 'weekly', 'daily'].forEach(m => {
const tabBtn = document.getElementById(`chartTab${m.charAt(0).toUpperCase() + m.slice(1)}`);
if (m === mode) {
tabBtn.className = "flex-1 py-1 rounded bg-white shadow-sm text-slate-800 transition";
} else {
tabBtn.className = "flex-1 py-1 rounded text-slate-500 hover:text-slate-800 transition";
}
});
renderAnalyticsChart(mode);
}

function getISOWeekKey(d) {
const date = new Date(d.getTime());
date.setHours(0, 0, 0, 0);
date.setDate(date.getDate() + 3 - (date.getDay() + 6) % 7);
const week1 = new Date(date.getFullYear(), 0, 4);
const weekNum = 1 + Math.round(((date.getTime() - week1.getTime()) / 86400000 - 3 + (week1.getDay() + 6) % 7) / 7);
return `${date.getFullYear()}-W${weekNum < 10 ? '0' + weekNum : weekNum}`;
}

function renderAnalyticsChart(mode) {
const canvas = document.getElementById('monthlyChart');
if(!canvas) return;
const ctx = canvas.getContext('2d');
const spots = window.spots || [];
const counts = {};

// ★ 集計の基準を「ピンを追加した日」ではなく「記録している訪問日（s.date）」のみにする
spots.forEach(s => {
// 訪問日が未入力のものはグラフから除外
if (!s.date || s.date.trim() === '') return;

if (mode === 'monthly') {
if (s.date.length >= 7) {
const key = s.date.substring(0, 7);
counts[key] = (counts[key] || 0) + 1;
}
} else if (mode === 'weekly') {
const d = new Date(s.date);
if (!isNaN(d.getTime())) {
const key = getISOWeekKey(d);
counts[key] = (counts[key] || 0) + 1;
}
} else if (mode === 'daily') {
if (s.date.length >= 10) {
counts[s.date] = (counts[s.date] || 0) + 1;
}
}
});

let sortedKeys = Object.keys(counts).sort();

if (sortedKeys.length === 0) {
const now = new Date();
if (mode === 'monthly') {
for (let i = 5; i >= 0; i--) {
const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
counts[d.toISOString().substring(0, 7)] = 0;
}
} else if (mode === 'daily') {
for (let i = 6; i >= 0; i--) {
const d = new Date();
d.setDate(d.getDate() - i);
counts[d.toISOString().substring(0, 10)] = 0;
}
} else if (mode === 'weekly') {
for (let i = 5; i >= 0; i--) {
const d = new Date();
d.setDate(d.getDate() - (i * 7));
counts[getISOWeekKey(d)] = 0;
}
}
sortedKeys = Object.keys(counts).sort();
}

const dataValues = sortedKeys.map(k => counts[k]);

if (chartInstance) {
chartInstance.destroy();
}

// ★ ラベルを増加数に変更
const chartLabel = mode === 'monthly' ? '月間増加数' : (mode === 'weekly' ? '週間増加数' : '日間増加数');

chartInstance = new Chart(ctx, {
type: 'bar',
data: {
labels: sortedKeys,
datasets: [{
label: chartLabel,
data: dataValues,
backgroundColor: 'rgba(244, 63, 94, 0.75)',
borderColor: 'rgb(244, 63, 94)',
borderWidth: 2,
borderRadius: 8
}]
},
options: {
responsive: true,
maintainAspectRatio: false,
plugins: { legend: { display: false } },
scales: { y: { beginAtZero: true, ticks: { precision: 0 } } }
}
});
}

function openAddModal(lat = null, lng = null, pref = null, name = '') {
removeSearchMarker();
document.getElementById('spotForm').reset();
document.getElementById('spotId').value = '';
tempPhotoBase64 = null;
document.getElementById('photoPreviewContainer').classList.add('hidden');
document.getElementById('photoPlaceholder').classList.remove('hidden');

const center = map.getCenter();
document.getElementById('spotLat').value = lat || center.lat;
document.getElementById('spotLng').value = lng || center.lng;

if (name) {
document.getElementById('spotName').value = name;
}

if (pref) {
document.getElementById('spotPref').value = pref;
} else {
document.getElementById('spotPref').value = findNearestPrefecture(lat || center.lat, lng || center.lng);
}

document.getElementById('spotAuthor').value = 'あつき';
document.getElementById('spotDate').value = new Date().toISOString().split('T')[0];

document.getElementById('modalTitle').innerHTML = '<i data-lucide="map-pin" class="w-5 h-5 text-rose-500"></i><span>思い出のスポットを保存</span>';
document.getElementById('spotModal').classList.remove('hidden');
lucide.createIcons();
}

window.editSpot = function(id) {
const spot = (window.spots || []).find(s => s.id === id);

closeDetailModal();

document.getElementById('spotId').value = spot.id;
document.getElementById('spotLat').value = spot.lat;
document.getElementById('spotLng').value = spot.lng;
document.getElementById('spotAuthor').value = spot.author || 'あつき';
document.getElementById('spotName').value = spot.name;
document.getElementById('spotPref').value = spot.pref;
document.getElementById('spotGenre').value = spot.genre;
document.getElementById('spotRating').value = spot.rating || 5;
document.getElementById('spotDate').value = spot.date || new Date().toISOString().split('T')[0];

tempPhotoBase64 = spot.photo || null;
if (tempPhotoBase64) {
document.getElementById('photoPreview').src = tempPhotoBase64;

document.getElementById('photoPlaceholder').classList.add('hidden');
} else {
document.getElementById('photoPreviewContainer').classList.add('hidden');
document.getElementById('photoPlaceholder').classList.remove('hidden');
}

document.getElementById('modalTitle').innerHTML = '<i data-lucide="edit-3" class="w-5 h-5 text-indigo-500"></i><span>スポット情報を編集</span>';

lucide.createIcons();
}

function closeAddModal() {
document.getElementById('spotModal').classList.add('hidden');
}

function handleImageUpload(e) {
const file = e.target.files[0];
if (!file) return;

const reader = new FileReader();
reader.onload = function(evt) {
const img = new Image();
img.onload = function() {
const canvas = document.createElement('canvas');
const MAX_WIDTH = 400;
let width = img.width;
let height = img.height;

if (width > MAX_WIDTH) {
height = Math.round((height * MAX_WIDTH) / width);
width = MAX_WIDTH;
}

canvas.width = width;
canvas.height = height;
const ctx = canvas.getContext('2d');
ctx.drawImage(img, 0, 0, width, height);

tempPhotoBase64 = canvas.toDataURL('image/jpeg', 0.5);

document.getElementById('photoPreview').src = tempPhotoBase64;
document.getElementById('photoPreviewContainer').classList.remove('hidden');
document.getElementById('photoPlaceholder').classList.add('hidden');
};
img.src = evt.target.result;
};
reader.readAsDataURL(file);
}

function saveSpot(e) {
e.preventDefault();

const id = document.getElementById('spotId').value || Date.now().toString();
const newSpot = {
id: id,
author: document.getElementById('spotAuthor').value,
name: document.getElementById('spotName').value,
pref: document.getElementById('spotPref').value,
genre: document.getElementById('spotGenre').value,
rating: parseInt(document.getElementById('spotRating').value),
date: document.getElementById('spotDate').value,
comment: document.getElementById('spotComment').value,
lat: parseFloat(document.getElementById('spotLat').value),
lng: parseFloat(document.getElementById('spotLng').value),
photo: tempPhotoBase64
};

window.spots = window.spots || [];
const index = window.spots.findIndex(s => s.id === id);
let isEdit = false;
if (index >= 0) {
if (!tempPhotoBase64) newSpot.photo = window.spots[index].photo;
window.spots[index] = newSpot;
isEdit = true;
} else {
window.spots.push(newSpot);
}

window.saveLocalStorageSpots();
if (window.saveSpotToCloud) window.saveSpotToCloud(newSpot);

window.renderMarkers();
window.updateProgress();
window.updateAnalytics();
closeAddModal();
showToast(isEdit ? "スポット情報を更新しました！" : "思い出スポットを保存しました！");
}

</button>

`;

document.getElementById('detailContent').innerHTML = content;

}

function showDeleteUI() {
document.getElementById('deleteConfirmBox').classList.remove('hidden');
document.getElementById('detailActionBox').classList.add('hidden');
}

function cancelDeleteUI() {
document.getElementById('deleteConfirmBox').classList.add('hidden');
document.getElementById('detailActionBox').classList.remove('hidden');
}

function executeDeleteSpot(id) {
window.spots = (window.spots || []).filter(s => s.id !== id);
window.saveLocalStorageSpots();
if (window.deleteSpotFromCloud) window.deleteSpotFromCloud(id);

window.renderMarkers();
window.updateProgress();
window.updateAnalytics();
closeDetailModal();
showToast("スポットを削除しました");
}

function closeDetailModal() {
document.getElementById('detailModal').classList.add('hidden');
}

function filterGenre(genre) {
currentFilter = genre;
document.querySelectorAll('.genre-btn').forEach(btn => {
btn.classList.remove('bg-slate-800', 'text-white');
btn.classList.add('bg-slate-100', 'text-slate-600');
});
event.target.classList.add('bg-slate-800', 'text-white');
window.renderMarkers();
}

window.saveLocalStorageSpots = function() {
try {
localStorage.setItem('shakemap_spots', JSON.stringify(window.spots || []));
} catch (e) {
console.warn("LocalStorage full");
}
};

function loadLocalStorageSpots() {
const data = localStorage.getItem('shakemap_spots');
if (data) {
try {
window.spots = JSON.parse(data) || [];
} catch (e) {
window.spots = [];
}
}
}
